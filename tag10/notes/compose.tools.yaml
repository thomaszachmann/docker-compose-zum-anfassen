# compose.tools.yaml – Werkzeuge (Stand Tag 10), per include eingebunden
services:
  psql:
    image: postgres:18.6-alpine
    profiles: [tools]
    # Passwort aus dem Secret; "$$@" reicht die Argumente von run an psql weiter
    entrypoint:
      - sh
      - -c
      - 'PGPASSWORD="$$(cat /run/secrets/db_password)" exec psql "$$@"'
      - psql
    environment:
      PGHOST: db
      PGUSER: notes
      PGDATABASE: notes
    secrets: [db_password]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
  backup:
    extends: psql
    entrypoint:
      - sh
      - -c
      - >-
        PGPASSWORD="$$(cat /run/secrets/db_password)"
        exec pg_dump --clean --if-exists > /backup/notes.sql
    volumes:
      - ./backup:/backup
networks:
  backend:
    internal: true
secrets:
  db_password:
    file: ./secrets/db_password.txt
