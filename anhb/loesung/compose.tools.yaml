# compose.tools.yaml – Werkzeuge, per include eingebunden
services:
  psql:
    image: postgres:18.6-alpine
    profiles: [tools]
    entrypoint: ["psql"]
    environment:
      PGHOST: db
      PGUSER: notes
      PGDATABASE: notes
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env)}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
  backup:
    extends: psql
    entrypoint: ["sh", "-c", "pg_dump --clean --if-exists > /backup/notes.sql"]
    volumes:
      - ./backup:/backup
networks:
  backend:
    internal: true
