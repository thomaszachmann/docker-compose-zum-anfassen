# compose.yaml – Stand Ende Tag 7
name: notes

include:
  - compose.tools.yaml

services:
  api:
    build: notes-api
    environment:
      NOTES_API_KEY: ${NOTES_API_KEY:?NOTES_API_KEY fehlt (.env)}
      NOTES_DB_URL: "postgres://notes:\
        ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env)}@db:5432/notes"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./notes-api

  migrate:
    build: notes-api
    command: ["migrate"]
    environment:
      NOTES_DB_URL: "postgres://notes:\
        ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env)}@db:5432/notes"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  worker:
    build: notes-worker
    environment:
      NOTES_API_URL: http://api:8080
      NOTES_API_KEY: ${NOTES_API_KEY:?NOTES_API_KEY fehlt (.env)}
      INTERVAL: ${WORKER_INTERVAL:-10}
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./notes-worker

  web:
    build: notes-web
    environment:
      NOTES_API_URL: http://api:8080
      NOTES_API_KEY: ${NOTES_API_KEY:?NOTES_API_KEY fehlt (.env)}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 2s
      start_period: 10s
      start_interval: 1s
    develop:
      watch:
        - action: sync
          path: ./notes-web/public
          target: /app/public
        - action: sync+restart
          path: ./notes-web/server.js
          target: /app/server.js
        - action: rebuild
          path: ./notes-web/package.json
        - action: rebuild
          path: ./notes-web/src

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env)}
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: db_init
        target: /docker-entrypoint-initdb.d/10-readonly.sql
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "notes", "-d", "notes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  pgdata: {}

configs:
  db_init:
    file: ./db/init/10-readonly.sql
